version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────
  # DEV AGENT - Autonomous agent for editing repo and running commands
  # Usage: docker-compose run --rm agent
  # ─────────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: cloudhop-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: development
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: npx tsx scripts/local-agent.ts
    profiles:
      - agent

  # ─────────────────────────────────────────────────────────────
  # FRONTEND - Vite React development server
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cloudhop-frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://api:3002/api
      VITE_RABBIT_AI_ENDPOINT: http://ai-sidecar:3002
    depends_on:
      - api
      - oauth
      - ai-sidecar
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # OAUTH SERVICE - Google OAuth handler
  # ─────────────────────────────────────────────────────────────
  oauth:
    image: node:20.18-alpine3.21
    container_name: cloudhop-oauth
    working_dir: /app
    command: sh -c "npm ci --frozen-lockfile 2>/dev/null || npm install && npm run dev:oauth"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - oauth_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/app}
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # API SERVICE - Backend Express server
  # ─────────────────────────────────────────────────────────────
  api:
    image: node:20.18-alpine3.21
    container_name: cloudhop-api
    working_dir: /app
    command: sh -c "npm ci --frozen-lockfile 2>/dev/null || npm install && npm run dev:server"
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3002
      ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173,http://api:3002
      VITE_APP_URL: http://localhost:5173
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAMS: ${STRIPE_PRICE_TEAMS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # OLLAMA - Free local LLM service
  # Downloads and runs open-source models locally
  # Models: mistral, llama2, neural-chat, etc.
  # Usage: docker-compose up ollama
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: cloudhop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    restart: unless-stopped
    profiles:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # AI SIDECAR - Autonomous AI service (companion to main app)
  # Supports both Ollama (free, local) and OpenAI (paid, cloud)
  # Usage: docker-compose up ai-sidecar ollama
  # ─────────────────────────────────────────────────────────────
  ai-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: cloudhop-ai-sidecar
    working_dir: /app
    ports:
      - "3003:3002"
    volumes:
      - ./src/server:/app/src/server
      - ./ai:/app/ai
    environment:
      NODE_ENV: development
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # PRODUCTION BUILD - Full nginx-based production image
  # Usage: docker-compose up cloudhop
  # ─────────────────────────────────────────────────────────────
  cloudhop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudhop-prod
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    profiles:
      - production

volumes:
  dev_node_modules:
  oauth_node_modules:
  api_node_modules:
  ollama_data:
