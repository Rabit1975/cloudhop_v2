services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -lc "sleep infinity"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:3002/api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      - frontend
      - oauth
      - api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:3002/api
    depends_on:
      - oauth
      - api
    restart: unless-stopped

  oauth:
    image: node:20.18-alpine3.21
    working_dir: /app
    command: sh -c "npm ci && npm run dev:oauth"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - oauth_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your_client_secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

  api:
    image: node:20.18-alpine3.21
    working_dir: /app
    command: sh -c "npm ci && npm run dev:server"
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3002
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      VITE_APP_URL: http://localhost:5173
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAMS: ${STRIPE_PRICE_TEAMS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped

  cloudhop:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  ai-sidecar:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -lc "sleep infinity"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped

volumes:
  dev_node_modules:
  oauth_node_modules:
  api_node_modules:
