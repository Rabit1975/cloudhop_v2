version: '3.8'

services:
  # ── Development (hot reload, runs inside container) ──────────
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app                  # live source mount — edits reflect instantly
      - /app/node_modules       # keep container node_modules separate
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # ensures file watch works on Windows
      - VITE_API_BASE_URL=http://localhost:3001/api
    restart: unless-stopped

  # ── API (Express for Supabase + Stripe) ─────────────────────
  api:
    image: node:20.18-alpine3.21
    working_dir: /app
    command: sh -c "npm ci && npm run dev:server"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - VITE_APP_URL=http://localhost:5173
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PRICE_PLUS
      - STRIPE_PRICE_PRO
      - STRIPE_PRICE_TEAMS
    restart: unless-stopped

  # ── Production (nginx static build) ─────────────────────────
  cloudhop:
    build: .
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Optional: Add a database or other services here
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
